plugins {
    id 'java'
    id 'idea'
    id 'net.minecraftforge.gradle' version '[6.0,6.2)'
}

group = mod_group
version = mod_version

base {
    archivesName = "autoftbq-agent-forge-${minecraft_version}"
}

java {
    sourceCompatibility = JavaVersion.VERSION_17
    targetCompatibility = JavaVersion.VERSION_17
}

minecraft {
    mappings channel: 'official', version: minecraft_version

    runs {
        client {
            workingDirectory project.file('run')
            property 'forge.logging.console.level', 'info'
            // Remap dependency mixin refmaps (Architectury/FTB) from SRG names
            // to the official mappings used by this development run.
            property 'mixin.env.remapRefMap', 'true'
            property 'mixin.env.refMapRemappingFile',
                    project.layout.buildDirectory.file('createSrgToMcp/output.srg').get().asFile.absolutePath
            mods {
                autoftbq_agent { source sourceSets.main }
            }
        }

    }
}

repositories {
    maven { url = 'https://maven.architectury.dev/' }
    maven { url = 'https://maven.ftb.dev/releases' }
}

dependencies {
    minecraft "net.minecraftforge:forge:${minecraft_version}-${forge_version}"
    implementation fg.deobf("dev.architectury:architectury-forge:${architectury_version}")
    implementation fg.deobf("dev.ftb.mods:ftb-library-forge:${ftb_library_version}")
    implementation fg.deobf("dev.ftb.mods:ftb-teams-forge:${ftb_teams_version}")
    implementation fg.deobf("dev.ftb.mods:ftb-quests-forge:${ftb_quests_version}")
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    options.release = 17
}

tasks.register('strictSnbtSmoke', JavaExec) {
    dependsOn testClasses
    classpath = sourceSets.test.runtimeClasspath
    mainClass = 'dev.autoftbq.agent.StrictSnbtSmoke'
}

tasks.register('questIndexSmoke', JavaExec) {
    dependsOn testClasses
    classpath = sourceSets.test.runtimeClasspath
    mainClass = 'dev.autoftbq.agent.QuestIndexSmoke'
}

tasks.register('sketchSmoke', JavaExec) {
    dependsOn testClasses
    classpath = sourceSets.test.runtimeClasspath
    mainClass = 'dev.autoftbq.agent.SketchSmoke'
}

processResources {
    inputs.properties([
        mod_id: mod_id,
        mod_name: mod_name,
        mod_version: mod_version,
        minecraft_version: minecraft_version,
        ftb_quests_version: ftb_quests_version,
    ])
    filesMatching(['META-INF/mods.toml', 'pack.mcmeta']) {
        expand(inputs.properties)
    }
}

jar {
    manifest {
        attributes([
            'Specification-Title': mod_name,
            'Specification-Vendor': 'AutoFTBQ',
            'Specification-Version': '1',
            'Implementation-Title': project.name,
            'Implementation-Version': project.version,
            'MixinConfigs': 'autoftbq_agent.mixins.json',
        ])
    }
}
